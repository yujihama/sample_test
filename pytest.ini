[pytest]
testpaths = tests
python_files = test_*.py
markers =
    smoke: 疎通テスト用マーカー
    e2e: エンドツーエンドテスト用マーカー
    integration: 統合テスト用マーカー
    api: APIテスト用マーカー
    workflow: ワークフローテスト用マーカー
    autonomous: 自律エージェントテスト用マーカー
addopts = 
    --verbose
    --html=reports/integration/report.html
    --json-report
    --json-report-file=reports/integration/report.json
    --cov=src
    --cov-report=html:reports/coverage
    --cov-report=xml:reports/coverage/coverage.xml
filterwarnings =
    ignore:Unknown config option\: env:pytest.PytestConfigWarning 