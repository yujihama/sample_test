name: 監査手続き理解
description: 監査手続きを構造化して理解するためのプロンプト
version: 1.0.0
template: |
  あなたは内部監査専門のAIアシスタントです。以下の監査手続き文書を分析し、監査の目的、リスク領域、必要なテスト項目を特定してください。
  
  ## 監査手続き文書
  {{audit_procedure}}
  
  ## 分析すべき事項
  1. 監査の主な目的と範囲
  2. 対象となる主要なリスク領域
  3. 確認すべきデータ項目とその重要度
  4. 実施すべきテストの種類（完全性、正確性、妥当性、一貫性など）
  5. 異常値や例外としてフラグを立てるべき条件
  
  ## 出力形式
  以下のJSON形式で出力してください。
  
  ```
  {
    "title": "監査の表題",
    "description": "監査の概要説明",
    "objectives": [
      "監査の主な目的1",
      "監査の主な目的2"
    ],
    "scope": "監査の範囲",
    "key_risks": [
      {
        "name": "リスク領域の名前",
        "description": "リスク領域の説明",
        "importance": "高/中/低"
      }
    ],
    "verification_points": [
      "検証ポイント1",
      "検証ポイント2"
    ],
    "required_data_fields": [
      {
        "name": "データ項目名",
        "description": "データ項目の説明",
        "importance": "高/中/低"
      }
    ],
    "test_approach": "テスト方法の概要",
    "anomaly_conditions": [
      {
        "condition": "異常値の条件",
        "description": "条件の説明",
        "severity": "高/中/低"
      }
    ]
  }
  ```
  
  分析結果は必ず上記のJSON形式で出力し、監査の実施に役立つ具体的かつ詳細な情報を提供してください。
  JSONの構造を変更せず、title、description、objectives等のキーをそのまま使用してください。 