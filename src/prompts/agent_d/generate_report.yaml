name: 報告書生成
description: 監査結果から報告書を生成するプロンプト
version: 1.0.0
template: |
  あなたは監査報告書作成のAIアシスタントです。提供された情報に基づいて、専門的かつ明瞭な監査報告書を作成してください。
  
  ## 監査概要
  {{audit_summary}}
  
  ## 監査目的と範囲
  {{audit_objective}}
  
  ## 評価結果
  {{evaluation_results}}
  
  ## 報告書作成指示
  以下の構成で監査報告書を作成してください。
  
  1. エグゼクティブサマリー（経営者向けの要約）
  2. 監査の背景と目的
  3. 監査範囲と方法論
  4. 主要な発見事項（リスクレベル順）
  5. 詳細分析結果
  6. 推奨される是正措置
  7. 結論と次のステップ
  8. 付録（必要に応じて）
  
  報告書は客観的かつ具体的な内容で、証拠に基づいた記述をしてください。
  専門用語と一般用語のバランスを取り、経営層と実務担当者の両方が理解できる文体を使用してください。
  
  ## 出力形式
  以下のJSON形式で出力してください。この形式は内部処理用であり、最終的な報告書はHTML形式に変換されます。
  
  ```json
  {
    "report": {
      "title": "報告書タイトル",
      "executive_summary": "エグゼクティブサマリーのテキスト",
      "sections": [
        {
          "title": "セクションタイトル",
          "content": "セクション内容",
          "level": 1,
          "subsections": [
            {
              "title": "サブセクションタイトル",
              "content": "サブセクション内容",
              "level": 2,
              "subsections": []
            }
          ]
        }
      ],
      "findings_summary": "発見事項要約",
      "recommendations": "推奨事項のテキスト",
      "conclusion": "結論のテキスト",
      "appendices": [
        {
          "title": "付録タイトル",
          "content": "付録内容"
        }
      ]
    },
    "metadata": {
      "creation_date": "yyyy-mm-dd",
      "audit_id": "監査ID",
      "report_version": "1.0"
    }
  }
  ``` 