[pytest]
asyncio_mode = strict
asyncio_default_fixture_loop_scope = function
# マーカーの定義
markers =
    # テストレベル/種類
    smoke: マーク付けされたテストをsmokeテストとして実行
    integration: 統合テスト
    e2e: エンドツーエンドテスト
    unit: ユニットテスト
    
    # 機能カテゴリ
    api: APIテスト
    workflow: workflow tests
    db: データベース関連のテスト
    messaging: メッセージング機能のテスト
    
    # エージェント関連
    agent_a: エージェントA（監査手続き理解・設計）のテスト
    agent_b: エージェントB（監査テスト実行）のテスト
    agent_c: エージェントC（結果評価・総括）のテスト
    agent_d: エージェントD（報告書作成）のテスト
    
    # 特性
    slow: 実行に時間がかかるテスト（CIで実行時間を最適化する場合に除外可能）
    fast: 高速に実行できるテスト
    flaky: 不安定になる可能性があるテスト（外部依存や非決定的要素を含むテスト）
    human_interaction: 人間の介入（問い合わせ・回答）を含むテスト
    
filterwarnings =
    ignore::DeprecationWarning:pydantic.*
    # 以下は必要に応じてコメントアウトを外して使用
    # ignore::PytestDeprecationWarning
    # ignore::PydanticDeprecatedSince20 

testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# テストレポートの設定
addopts = 
    -v --tb=short
    --html=reports/integration/report.html
    --json-report
    --json-report-file=reports/integration/report.json
    --cov=src
    --cov-report=html:reports/coverage
    --cov-report=xml:reports/coverage/coverage.xml

# ログの設定
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S 